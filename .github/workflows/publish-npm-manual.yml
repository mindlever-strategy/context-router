name: Publish npm (manual)

# Use when Changesets already bumped versions on main but npm publish failed
# (e.g. missing @context-router org). Does not create new version bumps.
# Skips packages whose current version is already on the registry so a partial
# release can finish (e.g. autogen after others published).

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - name: Verify npm token secret is configured
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::Missing GitHub secret NPM_TOKEN in the npm environment."
            echo "Add it at: Settings → Environments → npm → Environment secrets"
            echo "Secret name must be exactly NPM_TOKEN."
            exit 1
          fi
          echo "NPM_TOKEN is configured."
          echo "Token must be npm Classic → Automation (bypasses 2FA)."
          echo "Granular Publish tokens fail in CI with npm error EOTP."

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npm test
      - run: npm run pack:check

      - name: Publish packages (skip if version already exists)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          publish_one() {
            local workspace="$1"
            local pkg_dir="$2"
            local name version
            name="$(node -e "console.log(require('./packages/${pkg_dir}/package.json').name)")"
            version="$(node -e "console.log(require('./packages/${pkg_dir}/package.json').version)")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${name}@${version} (already on npm)"
              return 0
            fi
            echo "Publishing ${name}@${version} ..."
            npm publish --workspace="${workspace}" --access public --provenance
          }

          publish_one @context-router/mcp-server server
          publish_one @context-router/sdk sdk-typescript
          publish_one @context-router/langgraph-adapter langgraph-adapter
          publish_one @context-router/crewai-adapter crewai-adapter
          publish_one @context-router/autogen-adapter autogen-adapter
          publish_one @context-router/llamaindex-adapter llamaindex-adapter
